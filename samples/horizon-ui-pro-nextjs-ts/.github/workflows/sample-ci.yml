# GitHub Actions Workflow for Horizon UI Pro Next.js TypeScript Sample
# This workflow validates that the sample builds correctly.
#
# Note: This does not require the private Horizon UI Pro package by default.
# To enable private package support, add NPM_TOKEN as a repository secret.

name: Sample CI - Horizon UI Pro Next.js

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'samples/horizon-ui-pro-nextjs-ts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'samples/horizon-ui-pro-nextjs-ts/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: samples/horizon-ui-pro-nextjs-ts

jobs:
  build:
    name: Build Sample
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samples/horizon-ui-pro-nextjs-ts/package-lock.json

      # Optional: Configure NPM for private packages
      # Uncomment if using @horizon-ui/react private package
      # - name: Configure NPM
      #   run: |
      #     echo "@horizon-ui:registry=https://registry.npmjs.org/" >> .npmrc
      #     echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
      #   if: ${{ secrets.NPM_TOKEN != '' }}

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
        continue-on-error: true  # Don't fail on lint warnings

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ -d ".next" ]; then
            echo "✓ Build successful - .next directory created"
            ls -la .next/
          else
            echo "✗ Build failed - .next directory not found"
            exit 1
          fi

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samples/horizon-ui-pro-nextjs-ts/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript compile check
        run: npx tsc --noEmit

