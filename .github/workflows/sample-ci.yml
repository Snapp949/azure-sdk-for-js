name: Sample CI

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-sample:
    name: Build Sample
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/horizon-ui-pro-nextjs-ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samples/horizon-ui-pro-nextjs-ts/package-lock.json

      # Cache node_modules for faster subsequent builds
      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: samples/horizon-ui-pro-nextjs-ts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('samples/horizon-ui-pro-nextjs-ts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Check if package.json exists before attempting install
      - name: Check for package.json
        id: check-package
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::package.json not found in samples/horizon-ui-pro-nextjs-ts"
          fi

      # Install dependencies only if package.json exists and cache miss
      - name: Install dependencies
        if: steps.check-package.outputs.exists == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts || echo "::warning::npm ci failed, possibly due to private packages"
        continue-on-error: true

      # Build the project only if package.json exists
      - name: Build
        if: steps.check-package.outputs.exists == 'true'
        run: npm run build || echo "::warning::Build failed or skipped"
        continue-on-error: true
