name: Sample CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Cancel any in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache node_modules based on package-lock.json
      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: samples/horizon-ui-pro-nextjs-ts/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('samples/horizon-ui-pro-nextjs-ts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        id: install
        working-directory: samples/horizon-ui-pro-nextjs-ts
        continue-on-error: true
        run: npm ci

      - name: Handle private package failure
        if: steps.install.outcome == 'failure'
        run: |
          echo "npm ci failed - this may be due to private packages requiring authentication"
          echo "Please ensure NPM_TOKEN is configured for private package access"
          echo "Skipping build step..."

      - name: Build sample
        if: steps.install.outcome == 'success'
        working-directory: samples/horizon-ui-pro-nextjs-ts
        run: npm run build
